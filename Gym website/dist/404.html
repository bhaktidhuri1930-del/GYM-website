<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | IRONPULSE FITNESS</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .not-found-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: radial-gradient(circle at center, rgba(255, 77, 0, 0.08) 0%, rgba(13, 14, 18, 1) 70%);
    }
    .not-found-code {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(6rem, 15vw, 12rem);
      line-height: 1;
      background: linear-gradient(135deg, #ff4d00, #ff8c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .not-found-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      margin-bottom: 1rem;
      color: #fff;
    }
    .not-found-desc {
      color: #a0a5b5;
      max-width: 480px;
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="not-found-wrapper">
    <a href="/" class="logo" style="margin-bottom: 2rem;">
      <span class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </span>
      <span class="logo-text">IRON<span class="accent-text">PULSE</span></span>
    </a>
    <div class="not-found-code">404</div>
    <h1 class="not-found-title">Page Not Found</h1>
    <p class="not-found-desc">
      The workout plan you're looking for doesn't exist or has moved. Let's get you back on track to your training goals.
    </p>
    <a href="/" class="btn btn-primary btn-lg">Back to Home</a>
  </div>
</body>
</html>
